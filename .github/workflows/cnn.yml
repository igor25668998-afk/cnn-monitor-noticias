name: Monitor CNN

on:
  workflow_dispatch:

  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

jobs:

  monitor-cnn:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Executar monitor CNN
        run: python cnn.py

      - name: Verificar resultado
        run: |
          ls -lh resultados/resultado_cnn.json

      - name: Atualizar JSON no GitHub
        run: |
          git config user.name "CNN Monitor"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add resultados/resultado_cnn.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
          else
            git commit -m "Atualizar resultado CNN"
            git push origin main
          fi
